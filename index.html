<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOAR · Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#17110D;--surface:#1C1510;--card:#221913;--card2:#2A1F17;--line:#4A3526;--soft:rgba(245,233,220,.08);
--ember:#FF7A3D;--ember2:#FF915C;--gold:#FFC15E;--ink:#F5E9DC;--ink2:#D8CABA;--muted:#B3A596;--dim:#8A7B6C;--ok:#7BD88F;--bad:#F26951;
--d:"Baloo 2","Trebuchet MS",sans-serif;--b:"Lexend","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--b);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;left:-15%;right:-15%;bottom:-45vh;height:95vh;pointer-events:none;
background:radial-gradient(ellipse at 50% 100%,rgba(255,122,61,.24) 0%,rgba(255,122,61,.06) 45%,rgba(255,122,61,0) 70%);animation:glow 6s ease-in-out infinite}
@keyframes glow{50%{opacity:.7;transform:scale(1.04)}}
.app{position:relative;max-width:640px;margin:0 auto;padding:22px 16px 48px;min-height:100vh;display:flex;flex-direction:column}
/* HUD */
.lang{position:absolute;top:18px;right:16px;display:flex;gap:4px;z-index:5}
.lang button{appearance:none;cursor:pointer;font:700 12px var(--b);letter-spacing:.06em;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.lang button[aria-pressed="true"]{color:#17110D;background:var(--gold);border-color:var(--gold)}
.lang button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
body.playing .lang{display:none}
.hud{display:flex;align-items:center;gap:10px;margin-bottom:14px;visibility:hidden}
.hud.on{visibility:visible}
.chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:600 14px var(--b);white-space:nowrap}
.chip b{font:800 17px/1 var(--d);color:var(--gold)}
.chip.streak b{color:var(--ember)}
.chip.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.18)}}
.dots{flex:1;display:flex;gap:5px;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);transition:background .3s,transform .3s}
.dots i.now{background:var(--gold);transform:scale(1.35)}
.dots i.ok{background:var(--ok)}.dots i.no{background:var(--bad)}
/* screens */
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex;animation:enter .55s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes enter{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.center{align-items:center;justify-content:center;text-align:center;gap:10px}
.mascot{width:150px;height:150px;filter:drop-shadow(0 12px 20px rgba(0,0,0,.45))}
.mascot.idle{animation:bob 3.2s ease-in-out infinite}
.mascot.happy{animation:hop .7s cubic-bezier(.3,1.6,.5,1)}
.mascot.sad{animation:sad .8s ease}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-34px) rotate(-8deg) scale(1.08)}70%{transform:translateY(0) scale(.96,1.04)}100%{transform:none}}
@keyframes sad{30%{transform:rotate(-10deg) translateY(6px)}60%{transform:rotate(6deg)}100%{transform:none}}
h1{font:800 clamp(40px,10vw,64px)/1 var(--d);margin:6px 0 0}
h1 span{color:var(--ember)}
.sub{color:var(--ink2);margin:0 0 6px;max-width:30ch}
.pick{font:700 12px var(--b);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:380px}
.lvl{position:relative;appearance:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:18px 8px 14px;
color:var(--ink2);background:var(--card);border:2px solid var(--line);border-radius:18px;font:500 13px var(--b);
box-shadow:0 4px 0 #120D0A;transition:transform .15s,border-color .15s,box-shadow .15s,background .15s}
.lvl:hover{transform:translateY(-2px);border-color:#6B4D37}
.lvl b{font:800 19px/1.1 var(--d);color:var(--ink)}
.lvl .t{color:var(--muted)}
.lvl .x{margin-top:4px;font:800 13px/1 var(--d);color:var(--dim);background:var(--surface);border-radius:6px;padding:4px 7px 3px}
.lvl .tag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 10px/1 var(--b);letter-spacing:.06em;text-transform:uppercase;
color:#17110D;background:var(--ember);border-radius:6px;padding:4px 7px}
.lvl[aria-checked="true"]{background:linear-gradient(180deg,#3A2A1C,var(--card2));border-color:var(--gold);transform:translateY(-3px);
box-shadow:0 6px 0 #9A6A1F,0 12px 30px rgba(255,193,94,.25)}
.lvl[aria-checked="true"] .x{color:#17110D;background:var(--gold)}
.lvl[aria-checked="true"]::after{content:"✓";position:absolute;top:8px;right:10px;font:800 14px/1 var(--d);color:var(--gold)}
.lvl:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.rules{color:var(--muted);font-size:14px;margin:6px 0 16px}
.credit{display:inline-flex;align-items:center;gap:6px;margin:4px 0 10px;padding:6px 14px;border-radius:999px;background:rgba(255,193,94,.1);border:1px solid rgba(255,193,94,.45);color:var(--ink2);font:500 14px var(--b);text-decoration:none;transition:background .2s,transform .2s}
.credit b{color:var(--gold);font-weight:700}
.credit:hover{background:rgba(255,193,94,.2);transform:translateY(-1px)}
.credit:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.rules span{white-space:nowrap}
.btn{appearance:none;border:0;cursor:pointer;font:800 20px/1 var(--d);color:#17110D;background:linear-gradient(180deg,var(--ember2),var(--ember));
padding:16px 34px;border-radius:999px;box-shadow:0 6px 0 #B5501F,0 14px 30px rgba(255,122,61,.35);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #B5501F,0 6px 16px rgba(255,122,61,.3)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
a.btn{text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--line);font-size:17px;padding:12px 24px}
/* question */
.card{position:relative;background:var(--card);border:1px solid var(--soft);border-radius:24px;padding:20px 18px 18px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.card.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.timer{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-bottom:14px}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--ember));transform-origin:left;border-radius:999px}
.topic{font:600 13px var(--b);letter-spacing:.08em;text-transform:uppercase;color:var(--ember2)}
.qtext{font:800 clamp(22px,5.4vw,28px)/1.18 var(--d);margin:6px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:12px;text-align:left;width:100%;cursor:pointer;
background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font:500 15.5px/1.35 var(--b);
transition:transform .15s,border-color .2s,background .2s;animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
.opt:nth-child(2){animation-delay:.07s}.opt:nth-child(3){animation-delay:.14s}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--ember)}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt kbd{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);font:800 16px var(--d);color:var(--gold)}
.opt.ok{border-color:var(--ok);background:rgba(123,216,143,.12);animation:glowok .6s}
.opt.ok kbd{background:var(--ok);color:#17110D;border-color:var(--ok)}
.opt.no{border-color:var(--bad);background:rgba(242,105,81,.12)}
.opt.no kbd{background:var(--bad);color:#17110D;border-color:var(--bad)}
.opt:disabled{cursor:default}
.opt.fade{opacity:.45}
@keyframes glowok{50%{box-shadow:0 0 0 8px rgba(123,216,143,.18)}}
.explain{margin-top:14px;border-radius:16px;padding:14px 16px;background:rgba(255,193,94,.08);border:1px solid rgba(255,193,94,.3);display:none;animation:enter .4s both}
.explain.on{display:block}
.explain b{font:800 18px/1.2 var(--d);display:block;margin-bottom:4px}
.explain b.ok{color:var(--ok)}.explain b.no{color:var(--bad)}
.explain p{margin:0;color:var(--ink2);font-size:15px}
.next{margin-top:16px;align-self:flex-end;display:none}
.next.on{display:inline-block}
.side{display:flex;justify-content:center;margin-bottom:6px}
.side img{width:74px;height:74px}
/* floating xp */
.float{position:fixed;font:800 26px var(--d);color:var(--gold);pointer-events:none;text-shadow:0 4px 14px rgba(0,0,0,.5);animation:fl 1.1s ease-out forwards;z-index:10}
@keyframes fl{from{opacity:1;transform:translate(-50%,0) scale(.8)}to{opacity:0;transform:translate(-50%,-90px) scale(1.2)}}
/* end */
.ring{position:relative;width:190px;height:190px;margin:6px auto}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font:800 52px/1 var(--d)}
.ring .val small{display:block;font:600 14px var(--b);color:var(--muted)}
.rank{font:800 26px/1.1 var(--d);color:var(--gold);margin:4px 0}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 18px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}body::before{animation:none}}
</style>
</head>

let lang = (() => {
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "pt" || q === "en") return q;
  try { const s = localStorage.getItem("boar-quiz-lang"); if (s === "pt" || s === "en") return s; } catch (e) {}
  return "en";
})();
const T = () => STR[lang];
const Q = (k) => QUESTIONS[k][lang];
function applyLang(){
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
  $("title").innerHTML = lang === "pt" ? "Quiz <span>BOAR</span>" : "<span>BOAR</span> Quiz";
  document.title = lang === "pt" ? "BOAR · Quiz" : "BOAR · Quiz";
  $("sub").textContent = T().sub;
  $("rules").innerHTML = T().rules.map(r => `<span>${r}</span>`).join(" · "); $("pick").textContent = T().pick;
  $("levels").innerHTML = Object.entries(LEVELS).map(([k, {time:[a, b], mult}]) =>
    `<button type="button" class="lvl" role="radio" data-level="${k}" aria-checked="${k === level}" tabindex="${k === level ? 0 : -1}">`
    + (k === "prog" ? `<span class="tag">${T().rec}</span>` : "")
    + `<b>${T().levels[k]}</b>`
    + `<span class="t">${a === b ? a : `${a} → ${b}`} s</span><span class="x">×${mult} XP</span></button>`).join("");
  $("levelEnd").textContent = T().levels[level];
  $("start").textContent = T().start; $("again").textContent = T().again; $("share").textContent = T().share;
  for (const c of document.querySelectorAll(".creditLabel")) c.textContent = T().credit;
  $("hitsLabel").textContent = T().hits; $("bestLabel").textContent = T().best;
  for (const b of document.querySelectorAll(".lang button")) b.setAttribute("aria-pressed", b.dataset.lang === lang);
  if ($("end").classList.contains("on")) rankText();
}
function setLevel(l){ level = l; try { localStorage.setItem("boar-quiz-level", l); } catch (e) {} applyLang(); }
function setLang(l){ lang = l; try { localStorage.setItem("boar-quiz-lang", l); } catch (e) {} applyLang(); }
const BASE = 100, SPEED = 50;
const $ = (id) => document.getElementById(id);
let order, i, xp, streak, best, hits, timerStart, secs, raf, locked, results;

function show(id){for(const s of document.querySelectorAll(".screen"))s.classList.toggle("on",s.id===id);$("hud").classList.toggle("on",id==="play");document.body.classList.toggle("playing",id==="play")}
function shuffle(a){a=[...a];for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function bump(el){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}
function mascot(el,mood){el.classList.remove("idle","happy","sad");void el.offsetWidth;el.classList.add(mood);if(mood!=="idle")setTimeout(()=>{el.classList.remove(mood);el.classList.add("idle")},800)}

function start(){
  order=shuffle(QUESTIONS.map((_,k)=>k)); i=0; xp=0; streak=0; best=0; hits=0; results=[];
  $("xp").textContent=0; $("streak").textContent=0;
  $("dots").innerHTML=QUESTIONS.map(()=>"<i></i>").join("");
  show("play"); round();
}

function round(){
  locked=false;
  const q=Q(order[i]), a=QUESTIONS[order[i]].a;
  const dots=[...$("dots").children]; dots.forEach((d,k)=>d.classList.toggle("now",k===i));
  $("topic").textContent=`${q.topic} · ${i+1}/${QUESTIONS.length}`;
  $("qtext").textContent=q.q;
  const opts=shuffle(q.opts.map((t,k)=>({t,ok:k===a})));
  $("opts").innerHTML="";
  opts.forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.dataset.ok=o.ok;b.innerHTML=`<kbd>${k+1}</kbd><span></span>`;b.lastChild.textContent=o.t;b.onclick=()=>answer(b);$("opts").append(b)});
  $("explain").classList.remove("on"); $("next").classList.remove("on");
  const card=$("card"); card.style.animation="none"; void card.offsetWidth; card.style.animation="enter .5s cubic-bezier(.2,.9,.3,1.2) both";
  const [t0,t1]=LEVELS[level].time; secs=t0+(t1-t0)*i/(QUESTIONS.length-1);
  timerStart=performance.now(); cancelAnimationFrame(raf); tick();
}

function tick(){
  const left=Math.max(0,1-(performance.now()-timerStart)/(secs*1000));
  $("bar").style.transform=`scaleX(${left})`;
  if(left<=0){answer(null);return}
  if(!locked)raf=requestAnimationFrame(tick);
}

function answer(btn){
  if(locked)return; locked=true; cancelAnimationFrame(raf);
  const left=Math.max(0,1-(performance.now()-timerStart)/(secs*1000));
  const buttons=[...document.querySelectorAll(".opt")];
  const right=buttons.find(b=>b.dataset.ok==="true");
  const ok=btn===right;
  buttons.forEach(b=>{b.disabled=true;if(b!==right&&b!==btn)b.classList.add("fade")});
  right.classList.add("ok");
  const dot=$("dots").children[i];
  if(ok){
    hits++; streak++; best=Math.max(best,streak);
    const gain=Math.round((BASE+SPEED*left+(streak>1?25*(streak-1):0))*LEVELS[level].mult);
    xp+=gain; $("xp").textContent=xp; bump($("xp").parentElement); $("streak").textContent=streak; bump($("streakChip"));
    floatXP(btn,`+${gain}`); confetti(btn); mascot($("buddy"),"happy"); dot.className="ok";
    $("verdict").className="ok"; $("verdict").textContent=streak>2?T().rightStreak(streak):T().right;
  }else{
    streak=0; $("streak").textContent=0;
    if(btn)btn.classList.add("no");
    const card=$("card"); card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    mascot($("buddy"),"sad"); dot.className="no";
    $("verdict").className="no"; $("verdict").textContent=btn?T().almost:T().timeout;
  }
  results.push(ok);
  $("why").textContent=Q(order[i]).why;
  $("explain").classList.add("on"); $("next").classList.add("on");
  $("next").textContent=i===QUESTIONS.length-1?T().result:T().next; $("next").focus();
}

function next(){ if(!locked)return; i++; if(i<QUESTIONS.length)round(); else finish(); }

function finish(){
  parts=[]; cx.clearRect(0,0,innerWidth,innerHeight);
  show("end");
  $("hits").textContent=hits; $("xpEnd").textContent=xp; $("bestEnd").textContent=best;
  const arc=$("arc"),len=515.2; arc.style.transition="none"; arc.style.strokeDashoffset=len; void arc.offsetWidth;
  arc.style.transition="stroke-dashoffset 1.4s cubic-bezier(.2,.9,.3,1)"; arc.style.strokeDashoffset=len*(1-hits/QUESTIONS.length);
  rankText();
  mascot($("endMascot"),hits>=8?"happy":"idle");
  if(hits>=8)setTimeout(()=>bigConfetti(),300);
}

function rankText(){const [, title, text]=T().ranks.find(r=>hits>=r[0]);$("rank").textContent=title;$("rankText").textContent=text;shareLink(title)}

// opened from disk there is no public URL to share, so point at the live site
const SITE = "https://boar-faq-quiz.vercel.app/";
function shareLink(title){
  const base = location.protocol.startsWith("http") ? location.origin + location.pathname : SITE;
  const url = lang === "pt" ? base + "?lang=pt" : base;
  const grid = results.map(ok => ok ? "🟩" : "🟥").join("");
  const text = T().tweet(hits, QUESTIONS.length, title, grid, xp, best, T().levels[level]);
  $("share").href = "https://x.com/intent/post?" + new URLSearchParams({text, url});
}

/* effects */
function floatXP(el,text){const r=el.getBoundingClientRect();const f=document.createElement("div");f.className="float";f.textContent=text;f.style.left=(r.left+r.width/2)+"px";f.style.top=(r.top-10)+"px";document.body.append(f);setTimeout(()=>f.remove(),1100)}
const cv=$("fx"),cx=cv.getContext("2d");let parts=[];
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)} size(); addEventListener("resize",size);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const COLORS=["#FF7A3D","#FFC15E","#FF915C","#F5E9DC","#7BD88F"];
function burst(x,y,n,spread){if(reduce)return;for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,v=spread*(.4+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-spread*.6,r:3+Math.random()*4,c:COLORS[k%COLORS.length],life:1,rot:Math.random()*6,vr:(Math.random()-.5)*.4})}if(parts.length===n)loop()}
function confetti(el){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,36,7)}
function bigConfetti(){burst(innerWidth/2,innerHeight*.35,140,11)}
function loop(){cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life>0);for(const p of parts){p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.012;cx.save();cx.globalAlpha=Math.max(0,p.life);cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()}if(parts.length)requestAnimationFrame(loop);else cx.clearRect(0,0,innerWidth,innerHeight)}

$("levels").onclick=e=>{const b=e.target.closest("button");if(b)setLevel(b.dataset.level)};
$("levels").onkeydown=e=>{
  const step={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key]; if(!step)return; e.preventDefault();
  const keys=Object.keys(LEVELS); setLevel(keys[(keys.indexOf(level)+step+keys.length)%keys.length]);
  $("levels").querySelector('[aria-checked="true"]').focus();
};
$("start").onclick=start; $("again").onclick=start; $("next").onclick=next;
for (const b of document.querySelectorAll(".lang button")) b.onclick=()=>setLang(b.dataset.lang);
applyLang();
addEventListener("keydown",e=>{
  if(!$("play").classList.contains("on"))return;
  if(!locked&&["1","2","3"].includes(e.key)){const b=document.querySelectorAll(".opt")[+e.key-1];if(b)answer(b)}
  else if(locked&&(e.key==="Enter"||e.key===" ")){e.preventDefault();next()}
});
</script>
</body>
</html>
